<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Log In — 10X CRM</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="login">
    <div class="auth-wrap">
        <div class="card auth-card">
            <h1>Welcome back</h1>
            <form id="loginForm" novalidate>
                <div class="field"><input name="email" type="text" placeholder="Email"><small class="error"></small>
                </div>
                <div class="field"><input name="password" type="password" placeholder="Password"><small
                        class="error"></small></div>
                <button type="submit" style="width:100%">Log In</button>
            </form>
            <p class="muted center">Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
    </div>
    <div id="toasts"></div>
    <script src="js/core.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
