<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up — 10X CRM</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="signup">
<div class="auth-wrap"><div class="card auth-card"><h1>Create your account</h1>
<form id="signupForm" novalidate>
<div class="field"><input name="fullName" type="text" placeholder="Full Name"><small class="error"></small></div>
<div class="field"><input name="email" type="text" placeholder="Email"><small class="error"></small></div>
<div class="field"><input name="company" type="text" placeholder="Company (optional)"><small class="error"></small></div>
<div class="field"><input name="password" type="password" placeholder="Password"><small class="error"></small></div>
<div class="field"><input name="confirm" type="password" placeholder="Confirm Password"><small class="error"></small></div>
<button type="submit" style="width:100%">Create Account</button></form>
<p class="muted center">Already have an account? <a href="index.html">Log in</a></p></div></div>
<div id="toasts"></div><script src="js/core.js"></script><script src="js/auth.js"></script></body></html>
